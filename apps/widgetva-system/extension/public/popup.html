<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WidgetVA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        color: #17263d;
        background: #f7fbff;
      }

      body {
        width: 280px;
        margin: 0;
        padding: 14px;
      }

      .panel {
        display: grid;
        gap: 12px;
      }

      .title {
        display: grid;
        gap: 2px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #62738b;
        font-size: 12px;
        line-height: 1.45;
      }

      button {
        width: 100%;
        height: 34px;
        border: 1px solid #225f9f;
        border-radius: 7px;
        background: #225f9f;
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        border-color: #a9b7c8;
        background: #a9b7c8;
        cursor: default;
      }

      .status {
        min-height: 17px;
        font-size: 11px;
        color: #62738b;
      }

      .status.error {
        color: #9f3f3f;
      }

      .status.ready {
        color: #2f7d5c;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="title">
        <h1>WidgetVA</h1>
        <p>Load WidgetVA on the current Vega-Lite example page.</p>
      </section>
      <button id="load" type="button">Load WidgetVA</button>
      <div id="status" class="status" role="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
